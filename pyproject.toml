[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "phishguard"
version = "0.1.0"
description = "Two-stage phishing email detector (fine-tuned DistilBERT + character-level URL CNN) with a web demo"
requires-python = ">=3.11"
dependencies = [
  "torch>=2.4",
  "transformers>=4.45",
  "scikit-learn>=1.4",
  "pandas>=2.1",
  "numpy>=1.26",
  "joblib>=1.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra -m 'not acceptance'"
markers = [
  "req(id): links a test to a requirement ID in specs/",
  "slow: trains a tiny model (seconds, offline)",
  "acceptance: real data + trained models (opt-in: PHISHGUARD_ACCEPTANCE=1 pytest -m acceptance)",
]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::FutureWarning",
]
